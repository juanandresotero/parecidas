name: Actualizar propiedades

# Desde el 2026-11-26 RE/MAX bloquea a las computadoras de GitHub ("Failed to fetch"): la corrida diaria
# ahora la hace la PC de Juan (robot_pc.py + tarea de Windows, ver instalar_robot_pc.ps1).
# Esto queda SOLO a mano (pestaña Actions), por si algún día RE/MAX vuelve a dejar pasar a GitHub.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Navegador (RE/MAX rechaza los pedidos que no vienen de un navegador, desde 2026-11-14)
        run: pip install playwright==1.49.1 && python -m playwright install --with-deps chromium
      - name: Bajar propiedades de RE/MAX
        run: python build_listings.py
      - name: Guardar el archivo actualizado
        run: |
          git config user.name "parecidas-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add listings.json primera_vez.json historial.json fichas_al.json
          git commit -m "datos: actualizar propiedades ($(date -u +%F))" || echo "sin cambios"
          git pull --rebase || true
          git push
